<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Requirements Document (PRD) 생성기</title>
<style>
  :root{
    --blue-900:#0b2d6b;
    --blue-700:#1a56db;
    --blue-600:#2563eb;
    --blue-100:#e8f0fe;
    --blue-50:#f4f8ff;
    --gray-900:#1f2430;
    --gray-600:#5b6472;
    --gray-300:#d7dee8;
    --gray-100:#f1f4f9;
    --white:#ffffff;
    --danger:#d64545;
    --ok:#1b8a5a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    background:var(--white);
    color:var(--gray-900);
    line-height:1.55;
  }
  .app{
    display:grid;
    grid-template-columns: 1.15fr 1fr;
    min-height:100vh;
  }
  @media (max-width: 980px){
    .app{grid-template-columns:1fr;}
  }
  /* ===== 상단 바 ===== */
  .topbar{
    grid-column:1 / -1;
    border-bottom:1px solid var(--gray-300);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    background:var(--white);
    position:sticky;
    top:0;
    z-index:10;
  }
  .topbar h1{
    font-size:19px;
    margin:0;
    color:var(--blue-900);
    font-weight:800;
    letter-spacing:-0.3px;
  }
  .topbar .sub{
    font-size:12px;
    color:var(--gray-600);
    margin-top:2px;
  }
  .topbar-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  .maker-credit{
    font-size:12px;
    color:var(--gray-600);
    font-weight:600;
    white-space:nowrap;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:8px;
    font-size:13px;
    padding:9px 14px;
    transition:background .15s, border-color .15s, color .15s;
  }
  .btn-primary{background:var(--blue-600);color:#fff;}
  .btn-primary:hover{background:var(--blue-700);}
  .btn-outline{background:#fff;color:var(--blue-700);border:1px solid var(--blue-600);}
  .btn-outline:hover{background:var(--blue-50);}
  .btn-ghost{background:transparent;color:var(--gray-600);border:1px solid var(--gray-300);}
  .btn-ghost:hover{background:var(--gray-100);}
  .btn-danger-outline{background:#fff;color:var(--danger);border:1px solid var(--danger);}
  .btn-danger-outline:hover{background:#fdf1f1;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  button:disabled{opacity:.4;cursor:not-allowed;}

  /* ===== 왼쪽: 마법사 ===== */
  .wizard{
    padding:28px 32px 40px;
    border-right:1px solid var(--gray-300);
  }
  @media (max-width: 980px){
    .wizard{border-right:none;border-bottom:8px solid var(--gray-100);}
  }
  .progress-wrap{
    margin-bottom:22px;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--gray-600);
    margin-bottom:6px;
  }
  .progress-bar-bg{
    height:8px;
    background:var(--gray-100);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--blue-600),var(--blue-900));
    border-radius:999px;
    transition:width .25s;
  }
  .step-dots{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .dot{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;
    border:1.5px solid var(--gray-300);
    color:var(--gray-600);
    background:#fff;
    cursor:pointer;
    flex:0 0 auto;
  }
  .dot.active{border-color:var(--blue-600);color:var(--blue-700);background:var(--blue-50);}
  .dot.filled{background:var(--blue-600);border-color:var(--blue-600);color:#fff;}
  .dot.required.empty{border-color:var(--danger);color:var(--danger);}

  .step-card{
    background:var(--white);
    border:1px solid var(--gray-300);
    border-radius:var(--radius);
    padding:24px;
  }
  .step-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:4px;
  }
  .step-num{
    font-size:12px;
    font-weight:700;
    color:var(--blue-700);
    background:var(--blue-100);
    padding:2px 8px;
    border-radius:999px;
  }
  .step-title{
    font-size:18px;
    font-weight:800;
    color:var(--gray-900);
  }
  .req-badge{
    font-size:11px;
    color:var(--danger);
    border:1px solid var(--danger);
    padding:1px 6px;
    border-radius:999px;
  }
  .step-guide{
    font-size:13px;
    color:var(--gray-600);
    margin:8px 0 2px;
  }
  .step-example{
    font-size:12.5px;
    color:var(--blue-700);
    background:var(--blue-50);
    border-left:3px solid var(--blue-600);
    padding:7px 10px;
    border-radius:6px;
    margin:8px 0 16px;
  }
  .step-example b{color:var(--blue-900);}

  textarea, input[type=text]{
    width:100%;
    font-family:inherit;
    font-size:14px;
    border:1px solid var(--gray-300);
    border-radius:8px;
    padding:10px 12px;
    color:var(--gray-900);
    background:#fff;
  }
  textarea{resize:vertical;min-height:84px;}
  textarea:focus, input[type=text]:focus{outline:2px solid var(--blue-600);outline-offset:1px;}

  .chip-wrap{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:10px 0 16px;
  }
  .chip{
    font-size:13px;
    padding:8px 13px;
    border-radius:999px;
    border:1.5px solid var(--gray-300);
    background:#fff;
    color:var(--gray-900);
    cursor:pointer;
    user-select:none;
  }
  .chip:hover{border-color:var(--blue-600);}
  .chip.selected{
    background:var(--blue-600);
    border-color:var(--blue-600);
    color:#fff;
    font-weight:600;
  }

  .field-label{
    font-size:13px;
    font-weight:700;
    color:var(--gray-900);
    margin:14px 0 6px;
    display:block;
  }

  .feature-row{
    display:grid;
    grid-template-columns:1fr 1.6fr auto;
    gap:8px;
    margin-bottom:8px;
    align-items:start;
  }
  .feature-row input{font-size:13px;}
  .feature-row textarea{min-height:44px;font-size:13px;}
  .row-del{
    background:#fff;border:1px solid var(--gray-300);color:var(--gray-600);
    border-radius:8px;width:34px;height:34px;font-size:15px;
  }
  .row-del:hover{border-color:var(--danger);color:var(--danger);}

  .checklist-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .checklist-row input[type=text]{flex:1;}

  .suggest-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:6px 0 14px;
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    margin-top:22px;
  }
  .nav-row .right{display:flex;gap:8px;}

  .finish-box{
    text-align:center;
    padding:40px 20px;
  }
  .finish-box h2{color:var(--blue-900);font-size:22px;margin-bottom:8px;}
  .finish-box p{color:var(--gray-600);font-size:14px;margin-bottom:22px;}
  .finish-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .finish-actions button{padding:13px 22px;font-size:14.5px;}

  .warn-banner{
    background:#fff6f0;
    border:1px solid #f0c38a;
    color:#8a5a00;
    font-size:12.5px;
    padding:9px 12px;
    border-radius:8px;
    margin-bottom:16px;
  }

  /* ===== 오른쪽: 실시간 미리보기 ===== */
  .preview-pane{
    background:var(--gray-100);
    padding:24px 28px 60px;
    overflow-y:auto;
    max-height:calc(100vh - 0px);
  }
  .preview-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .preview-head h2{
    font-size:14px;
    color:var(--blue-900);
    margin:0;
    font-weight:800;
  }
  .copy-flash{
    font-size:12px;
    color:var(--ok);
    font-weight:700;
  }
  .preview-doc{
    background:#fff;
    border:1px solid var(--gray-300);
    border-radius:var(--radius);
    padding:22px 24px;
    font-size:13px;
    white-space:pre-wrap;
    word-break:break-word;
    color:var(--gray-900);
    min-height:300px;
  }
  .preview-doc .missing{color:var(--danger);}

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    background:var(--gray-900);
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    z-index:100;
  }
  .toast.show{opacity:1;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,20,40,.4);
    display:none;align-items:center;justify-content:center;z-index:200;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff;border-radius:12px;padding:24px;max-width:380px;width:90%;
    box-shadow:0 10px 40px rgba(0,0,0,.2);
  }
  .modal-box h3{margin-top:0;font-size:16px;color:var(--gray-900);}
  .modal-box p{font-size:13px;color:var(--gray-600);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  /* 예시 보기 전용 모달 (더 큰 박스) */
  .example-box{
    max-width:640px;
    width:92%;
    max-height:84vh;
    display:flex;
    flex-direction:column;
  }
  .example-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .example-head p{margin:4px 0 0;}
  .example-badge{
    font-size:11px;
    color:var(--blue-700);
    background:var(--blue-100);
    padding:3px 9px;
    border-radius:999px;
    font-weight:700;
    white-space:nowrap;
  }
  .example-doc{
    margin-top:14px;
    border:1px solid var(--gray-300);
    border-radius:8px;
    background:var(--gray-100);
    padding:16px 18px;
    font-size:12.5px;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-y:auto;
    flex:1;
    min-height:200px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div>
      <h1>Project Requirements Document (PRD) 생성기</h1>
      <div class="sub">질문에 하나씩 답하면 오른쪽에 PRD 문서가 완성됩니다</div>
    </div>
    <div class="topbar-actions">
      <span class="maker-credit">APP 제작 · 김형섭</span>
      <button class="btn-ghost btn-sm" id="btnExample">예시 보기</button>
      <button class="btn-ghost btn-sm" id="btnInterview">인터뷰용 프롬프트 복사</button>
      <button class="btn-danger-outline btn-sm" id="btnReset">모두 지우기</button>
    </div>
  </div>

  <div class="wizard">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progressText">0 / 13 단계 작성</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      <div class="step-dots" id="stepDots"></div>
    </div>

    <div id="stepArea"></div>
  </div>

  <div class="preview-pane">
    <div class="preview-head">
      <h2>실시간 PRD 미리보기</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="copy-flash" id="copyFlash"></span>
        <button class="btn-outline btn-sm" id="btnCopy">📋 복사</button>
        <button class="btn-primary btn-sm" id="btnDownload">⬇ .md 저장</button>
      </div>
    </div>
    <div class="preview-doc" id="previewDoc"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="resetModal">
  <div class="modal-box">
    <h3>모두 지울까요?</h3>
    <p>지금까지 입력한 모든 내용이 사라집니다. 이 작업은 되돌릴 수 없습니다.</p>
    <div class="modal-actions">
      <button class="btn-ghost btn-sm" id="resetCancel">취소</button>
      <button class="btn-danger-outline btn-sm" id="resetConfirm">모두 지우기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="exampleModal">
  <div class="modal-box example-box">
    <div class="example-head">
      <div>
        <h3 style="margin:0;">예시 PRD 보기</h3>
        <p>지금 작성 중인 내용은 전혀 건드리지 않아요. 참고용으로만 보여드려요.</p>
      </div>
      <span class="example-badge">참고용</span>
    </div>
    <div class="example-doc" id="exampleDoc"></div>
    <div class="modal-actions">
      <button class="btn-outline btn-sm" id="exampleCopy">📋 예시 복사</button>
      <button class="btn-primary btn-sm" id="exampleClose">닫기</button>
    </div>
  </div>
</div>

<script>
/* ===================== 데이터 정의 ===================== */

const CONSTRAINT_CHIPS = ["HTML 파일 1개로 동작","인터넷·외부 API 없이 동작","API 키·결제 기능 없음","기존 파일을 덮어쓰지 않고 새 버전 번호로 저장","이미지는 저장·전송하지 않음(화면 미리보기만)","화면은 한국어"];
const OUTOFSCOPE_CHIPS = ["이미지·영상 직접 생성","로그인·서버·여러 사용자","결제","데이터 서버 저장","모바일 앱 배포"];
const GOAL_CHIPS = ["클릭만으로 결과가 나온다","복사해서 바로 쓸 수 있다","새로고침해도 입력이 유지된다","인터넷이 끊겨도 동작한다"];
const STORAGE_CHIPS = ["입력 내용 자동 저장(localStorage)","업로드 이미지는 저장하지 않음","새로고침해도 유지됨","초기화 버튼 제공"];
const SCREEN_CHIPS = ["왼쪽 선택 / 오른쪽 결과","위아래 분할","탭 전환형","한 화면에 순서대로(마법사형)"];
const USER_CHIPS = ["건축사·설계자","건축주","인테리어 디자이너","일반 사용자(비전문가)","사내 담당자"];
const RULE_CHIPS = ["조건을 선택하면 결과 문장이 바뀐다","값을 비우면 해당 항목이 결과에서 빠진다","여러 개를 고르면 쉼표로 이어진다"];
const NEXTVER_CHIPS = ["기록 저장 기능 추가","칩 종류 더 추가","다국어(영어) 지원","모바일 화면 최적화"];

const STEPS = [
  {key:"meta", title:"앱 이름 · 버전 · 작성자", required:true,
   guide:"지금 만들려는 앱의 이름과 버전, 작성자를 적어주세요. 문서 맨 위에 들어갑니다.",
   example:"건축 프롬프트 빌더 v1.4.11 / 김형섭"},
  {key:"background", title:"배경과 목적", required:true,
   guide:"왜 이 앱을 만드는지, 어떤 불편을 해결하는지 적어주세요.",
   example:"건축 이미지를 만들 때마다 영어 프롬프트를 새로 쓰기 번거롭다"},
  {key:"users", title:"사용자", required:false,
   guide:"누가, 어떤 상황에서 이 앱을 쓰나요?",
   example:"건축사·설계자가 현상설계 분위기 이미지를 만들 때"},
  {key:"goals", title:"목표와 성공 기준", required:false,
   guide:"어떻게 되면 '잘 만든 것'인지 해당하는 걸 고르거나 직접 적어주세요.",
   example:"칩 몇 개만 눌러도 바로 쓸 프롬프트가 나온다"},
  {key:"constraints", title:"기술 조건 (제약)", required:true,
   guide:"꼭 지켜야 할 것, 하면 안 되는 것을 고르거나 직접 적어주세요.",
   example:"HTML 1개, 인터넷 없이 동작, API 키 사용 안 함, 기존 파일 덮어쓰기 금지"},
  {key:"screens", title:"화면 구성", required:false,
   guide:"어떤 화면이 어떻게 놓이는지 골라주세요.",
   example:"왼쪽 선택 영역, 오른쪽 결과 영역"},
  {key:"features", title:"기능 명세", required:true,
   guide:"있어야 할 기능을 하나씩 추가해주세요. (가장 중요한 항목입니다)",
   example:"칩 선택 / 화면 비율 / 사물→건물 변환 / 한글 번역 / 복사"},
  {key:"rules", title:"동작 규칙", required:false,
   guide:"입력에 따라 결과가 어떻게 바뀌는지 적어주세요.",
   example:"'극 사실'을 고르면 미드저니에 --style raw가 붙는다"},
  {key:"storage", title:"저장 · 초기 상태", required:false,
   guide:"무엇이 저장되고, 무엇이 사라지는지 골라주세요.",
   example:"업로드 이미지는 저장하지 않음"},
  {key:"outofscope", title:"범위 밖", required:false,
   guide:"이번 버전에서는 하지 않을 것을 골라주세요.",
   example:"이미지 직접 생성 기능은 넣지 않음"},
  {key:"limitations", title:"알려진 한계", required:false,
   guide:"지금 알고 있는 약점을 적어주세요.",
   example:"AI 결과물의 사실감은 앱이 보장하지 못함"},
  {key:"checklist", title:"완료 확인 체크리스트", required:false,
   guide:"잘 만들어졌는지 확인할 항목을 추가해주세요. 기능 명세에서 자동으로 제안해 드려요.",
   example:"칩을 누르면 문장이 맞게 바뀐다"},
  {key:"nextversion", title:"다음 버전 후보", required:false,
   guide:"지금은 아니지만 나중에 하고 싶은 것을 적어주세요.",
   example:"기록 저장, 새 칩 추가"},
];

const TOTAL_STEPS = STEPS.length;

/* ===================== 상태 ===================== */

const STORAGE_KEY = "prdWriterState_v1";

function emptyState(){
  return {
    cur:0,
    meta:{ name:"", version:"v1.0", author:"" },
    background:{ text:"", chips:[] },
    users:{ text:"", chips:[] },
    goals:{ text:"", chips:[] },
    constraints:{ text:"", chips:[] },
    screens:{ text:"", chips:[] },
    features:[],
    rules:{ text:"", chips:[] },
    storage:{ text:"", chips:[] },
    outofscope:{ text:"", chips:[] },
    limitations:{ text:"" },
    checklist:[],
    nextversion:{ text:"", chips:[] },
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return emptyState();
    const parsed = JSON.parse(raw);
    return Object.assign(emptyState(), parsed);
  }catch(e){
    return emptyState();
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* 저장이 막혀도 앱은 계속 동작 */ }
}

/* ===================== 렌더: 마법사 ===================== */

function isStepFilled(key){
  const s = state[key];
  if(key === "meta") return !!(state.meta.name && state.meta.name.trim());
  if(key === "features") return state.features.length > 0 && state.features.some(f=>f.name && f.name.trim());
  if(key === "checklist") return state.checklist.length > 0;
  if(key === "limitations") return !!(state.limitations.text && state.limitations.text.trim());
  if(!s) return false;
  const hasText = s.text && s.text.trim().length>0;
  const hasChips = s.chips && s.chips.length>0;
  return !!(hasText || hasChips);
}

function renderDots(){
  const wrap = document.getElementById("stepDots");
  wrap.innerHTML = "";
  STEPS.forEach((step, idx)=>{
    const d = document.createElement("div");
    const filled = isStepFilled(step.key);
    d.className = "dot" + (idx===state.cur?" active":"") + (filled?" filled":"") + (step.required && !filled ? " required empty":"");
    d.textContent = idx+1;
    d.title = step.title + (step.required ? " (중요)" : "");
    d.onclick = ()=>{ state.cur = idx; render(); };
    wrap.appendChild(d);
  });
}

function renderProgress(){
  const filledCount = STEPS.filter(s=>isStepFilled(s.key)).length;
  document.getElementById("progressText").textContent = `${filledCount} / ${TOTAL_STEPS} 단계 작성`;
  const pct = Math.round(filledCount / TOTAL_STEPS * 100);
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("progressFill").style.width = pct + "%";
}

function chipGroupHtml(key, list, groupLabel){
  const sel = state[key].chips;
  const chips = list.map(c=>{
    const on = sel.includes(c);
    return `<div class="chip${on?' selected':''}" data-chip="${encodeURIComponent(c)}">${c}</div>`;
  }).join("");
  return `
    ${groupLabel ? `<span class="field-label">${groupLabel}</span>` : ""}
    <div class="chip-wrap" data-chipgroup="${key}">${chips}</div>
  `;
}

function stepBodyHtml(step){
  const k = step.key;
  if(k === "meta"){
    return `
      <span class="field-label">앱 이름 *</span>
      <input type="text" id="f_appName" placeholder="예: 건축 프롬프트 빌더" value="${escapeAttr(state.meta.name)}">
      <span class="field-label">버전</span>
      <input type="text" id="f_version" placeholder="예: v1.0" value="${escapeAttr(state.meta.version)}">
      <span class="field-label">작성자</span>
      <input type="text" id="f_author" placeholder="예: 김형섭" value="${escapeAttr(state.meta.author)}">
    `;
  }
  if(k === "features"){
    const rows = state.features.map((f, i)=>`
      <div class="feature-row" data-idx="${i}">
        <input type="text" class="feat-name" placeholder="기능 이름" value="${escapeAttr(f.name)}">
        <textarea class="feat-desc" placeholder="설명">${escapeHtml(f.desc||"")}</textarea>
        <button class="row-del" data-del="${i}" title="삭제">×</button>
      </div>
    `).join("");
    return `
      <div id="featureRows">${rows}</div>
      <button class="btn-outline btn-sm" id="btnAddFeature" style="margin-top:4px;">+ 기능 추가</button>
    `;
  }
  if(k === "checklist"){
    const suggestions = state.features
      .filter(f=>f.name && f.name.trim())
      .map(f=>`${f.name} 기능이 동작한다`)
      .filter(s=>!state.checklist.includes(s));
    const sugHtml = suggestions.map(s=>`<div class="chip" data-suggest="${encodeURIComponent(s)}">+ ${s}</div>`).join("");
    const rows = state.checklist.map((item, i)=>`
      <div class="checklist-row" data-idx="${i}">
        <input type="text" class="chk-item" value="${escapeAttr(item)}">
        <button class="row-del" data-chkdel="${i}" title="삭제">×</button>
      </div>
    `).join("");
    return `
      ${suggestions.length ? `<span class="field-label">기능 명세에서 자동 제안</span><div class="suggest-row">${sugHtml}</div>` : ""}
      <span class="field-label">체크리스트 항목</span>
      <div id="checklistRows">${rows}</div>
      <button class="btn-outline btn-sm" id="btnAddChecklist" style="margin-top:4px;">+ 항목 추가</button>
    `;
  }
  if(k === "limitations"){
    return `<textarea id="f_limitations" placeholder="${step.example}">${escapeHtml(state.limitations.text)}</textarea>`;
  }

  // 공통: 칩 그룹 + 보조 서술칸
  const chipMap = {
    background: null,
    users: USER_CHIPS,
    goals: GOAL_CHIPS,
    constraints: CONSTRAINT_CHIPS,
    screens: SCREEN_CHIPS,
    rules: RULE_CHIPS,
    storage: STORAGE_CHIPS,
    outofscope: OUTOFSCOPE_CHIPS,
    nextversion: NEXTVER_CHIPS,
  };
  const chips = chipMap[k];
  let html = "";
  if(chips){
    html += chipGroupHtml(k, chips, "자주 쓰는 문장 (클릭해서 선택, 여러 개 가능)");
  }
  html += `<span class="field-label">${chips ? "직접 추가로 쓰기 (선택)" : "내용을 적어주세요"}</span>`;
  html += `<textarea id="f_${k}_text" placeholder="${step.example}">${escapeHtml(state[k].text)}</textarea>`;
  return html;
}

function render(){
  renderDots();
  renderProgress();

  const area = document.getElementById("stepArea");
  const idx = state.cur;

  if(idx >= TOTAL_STEPS){
    area.innerHTML = renderFinish();
    bindFinish();
    return;
  }

  const step = STEPS[idx];
  const missingCore = STEPS.filter(s=>s.required && !isStepFilled(s.key));

  area.innerHTML = `
    <div class="step-card">
      ${ (idx===TOTAL_STEPS-1 && missingCore.length) ? `<div class="warn-banner">⚠ 중요 항목이 비어 있어요: ${missingCore.map(s=>s.title).join(", ")}</div>` : "" }
      <div class="step-head">
        <span class="step-num">${idx+1} / ${TOTAL_STEPS}</span>
        <span class="step-title">${step.title}</span>
        ${step.required ? '<span class="req-badge">중요</span>' : ''}
      </div>
      <div class="step-guide">${step.guide}</div>
      <div class="step-example"><b>건축 예시</b> · ${step.example}</div>
      ${stepBodyHtml(step)}
      <div class="nav-row">
        <button class="btn-ghost" id="btnPrev" ${idx===0?'disabled':''}>← 이전</button>
        <div class="right">
          <button class="btn-primary" id="btnNext">${idx===TOTAL_STEPS-1 ? '완료 →' : '다음 →'}</button>
        </div>
      </div>
    </div>
  `;

  bindStepEvents(step);
  renderPreview();
}

function renderFinish(){
  const missingCore = STEPS.filter(s=>s.required && !isStepFilled(s.key));
  return `
    <div class="step-card finish-box">
      <h2>🎉 PRD 초안이 완성됐어요</h2>
      <p>오른쪽 미리보기에서 전체 내용을 확인하고, 복사하거나 파일로 저장하세요.</p>
      ${missingCore.length ? `<div class="warn-banner" style="text-align:left;">⚠ 아직 비어 있는 중요 항목: ${missingCore.map(s=>s.title).join(", ")} — 눌러서 채우시면 더 좋아요.</div>` : ""}
      <div class="finish-actions">
        <button class="btn-outline" id="finBack">← 처음부터 다시 보기</button>
        <button class="btn-outline" id="finCopy">📋 PRD 복사하기</button>
        <button class="btn-primary" id="finDownload">⬇ .md 파일로 저장</button>
      </div>
    </div>
  `;
}

function bindFinish(){
  document.getElementById("finBack").onclick = ()=>{ state.cur = 0; render(); };
  document.getElementById("finCopy").onclick = copyPrd;
  document.getElementById("finDownload").onclick = downloadPrd;
}

function bindStepEvents(step){
  const k = step.key;

  if(k === "meta"){
    document.getElementById("f_appName").oninput = e=>{ state.meta.name = e.target.value; afterChange(); };
    document.getElementById("f_version").oninput = e=>{ state.meta.version = e.target.value; afterChange(); };
    document.getElementById("f_author").oninput = e=>{ state.meta.author = e.target.value; afterChange(); };
  }
  else if(k === "features"){
    document.getElementById("btnAddFeature").onclick = ()=>{
      state.features.push({name:"", desc:""});
      afterChange(true);
    };
    document.querySelectorAll(".feat-name").forEach(el=>{
      el.oninput = e=>{
        const i = +e.target.closest(".feature-row").dataset.idx;
        state.features[i].name = e.target.value;
        afterChange();
      };
    });
    document.querySelectorAll(".feat-desc").forEach(el=>{
      el.oninput = e=>{
        const i = +e.target.closest(".feature-row").dataset.idx;
        state.features[i].desc = e.target.value;
        afterChange();
      };
    });
    document.querySelectorAll("[data-del]").forEach(el=>{
      el.onclick = e=>{
        const i = +e.target.dataset.del;
        state.features.splice(i,1);
        afterChange(true);
      };
    });
  }
  else if(k === "checklist"){
    document.querySelectorAll("[data-suggest]").forEach(el=>{
      el.onclick = e=>{
        const text = decodeURIComponent(e.target.dataset.suggest);
        state.checklist.push(text);
        afterChange(true);
      };
    });
    document.getElementById("btnAddChecklist").onclick = ()=>{
      state.checklist.push("");
      afterChange(true);
    };
    document.querySelectorAll(".chk-item").forEach(el=>{
      el.oninput = e=>{
        const i = +e.target.closest(".checklist-row").dataset.idx;
        state.checklist[i] = e.target.value;
        afterChange();
      };
    });
    document.querySelectorAll("[data-chkdel]").forEach(el=>{
      el.onclick = e=>{
        const i = +e.target.dataset.chkdel;
        state.checklist.splice(i,1);
        afterChange(true);
      };
    });
  }
  else if(k === "limitations"){
    document.getElementById("f_limitations").oninput = e=>{ state.limitations.text = e.target.value; afterChange(); };
  }
  else{
    const chipGroup = document.querySelector(`[data-chipgroup="${k}"]`);
    if(chipGroup){
      chipGroup.querySelectorAll(".chip").forEach(el=>{
        el.onclick = ()=>{
          const val = decodeURIComponent(el.dataset.chip);
          const arr = state[k].chips;
          const pos = arr.indexOf(val);
          if(pos>=0) arr.splice(pos,1); else arr.push(val);
          afterChange(true);
        };
      });
    }
    const textarea = document.getElementById(`f_${k}_text`);
    if(textarea){
      textarea.oninput = e=>{ state[k].text = e.target.value; afterChange(); };
    }
  }

  const prevBtn = document.getElementById("btnPrev");
  const nextBtn = document.getElementById("btnNext");
  if(prevBtn) prevBtn.onclick = ()=>{ state.cur = Math.max(0, state.cur-1); render(); };
  if(nextBtn) nextBtn.onclick = ()=>{ state.cur = Math.min(TOTAL_STEPS, state.cur+1); render(); };
}

function afterChange(rerender){
  saveState();
  if(rerender){ render(); } else { renderDots(); renderProgress(); renderPreview(); }
}

/* ===================== 마크다운 조립 (내 작업용) ===================== */

function orDash(text){
  return (text && text.trim()) ? text.trim() : "(작성 필요)";
}

function listBlock(key){
  const s = state[key];
  const items = [...s.chips];
  if(s.text && s.text.trim()) items.push(s.text.trim());
  if(items.length===0) return "- (작성 필요)";
  return items.map(i=>`- ${i}`).join("\n");
}

function buildMarkdown(){
  const name = orDash(state.meta.name);
  const version = state.meta.version && state.meta.version.trim() ? state.meta.version.trim() : "(작성 필요)";
  const author = state.meta.author && state.meta.author.trim() ? state.meta.author.trim() : "(작성 필요)";
  const today = new Date().toISOString().slice(0,10);

  const featuresTable = state.features.length
    ? "| 번호 | 기능 | 설명 |\n|---|---|---|\n" + state.features.map((f,i)=>`| ${i+1} | ${f.name && f.name.trim() ? f.name.trim() : "(작성 필요)"} | ${f.desc && f.desc.trim() ? f.desc.trim() : "(작성 필요)"} |`).join("\n")
    : "| 번호 | 기능 | 설명 |\n|---|---|---|\n| 1 | (작성 필요) | (작성 필요) |";

  const checklistBlock = state.checklist.length
    ? state.checklist.map(c=>`- [ ] ${c && c.trim() ? c.trim() : "(작성 필요)"}`).join("\n")
    : "- [ ] (작성 필요)";

  return `# PRD — ${name}

- 기준 버전: ${version}
- 작성일: ${today}
- 소유자: ${author}

---

## 1. 배경과 목적
${orDash(state.background.text || (state.background.chips.join(" ") ))}

## 2. 사용자
${listBlock("users")}

## 3. 목표와 성공 기준
${listBlock("goals")}

## 4. 기술 조건 (제약)
${listBlock("constraints")}

## 5. 화면 구성
${listBlock("screens")}

## 6. 기능 명세
${featuresTable}

## 7. 동작 규칙
${listBlock("rules")}

## 8. 저장과 초기 상태
${listBlock("storage")}

## 9. 범위 밖
${listBlock("outofscope")}

## 10. 알려진 한계
${orDash(state.limitations.text)}

## 11. 완료 확인 체크리스트
${checklistBlock}

## 12. 다음 버전 후보
${listBlock("nextversion")}
`;
}

function renderPreview(){
  const md = buildMarkdown();
  document.getElementById("previewDoc").textContent = md;
}

/* ===================== 복사 / 저장 ===================== */

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove("show"), 1800);
}

function copyText(text, flashEl){
  const done = ()=>{
    showToast("복사됐어요 ✓");
    if(flashEl){ flashEl.textContent = "복사됨 ✓"; setTimeout(()=>flashEl.textContent="", 1500); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); done(); }
  catch(e){ showToast("복사에 실패했어요. 직접 선택해서 복사해주세요."); }
  document.body.removeChild(ta);
}

function copyPrd(){
  copyText(buildMarkdown(), document.getElementById("copyFlash"));
}

function downloadPrd(){
  const md = buildMarkdown();
  const name = state.meta.name && state.meta.name.trim() ? state.meta.name.trim() : "앱이름";
  const blob = new Blob([md], {type:"text/markdown;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `PRD-${name}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("파일로 저장했어요 ✓");
}

/* ===================== 예시 보기 (내 작업과 완전히 분리) ===================== */
/* v1.2: "예시 불러오기"가 작성 중인 내용을 지워버리던 문제를 고쳤습니다.
   이제는 state를 전혀 건드리지 않고, 별도 markdown 문자열을 만들어 모달에만 보여줍니다. */

function buildExampleMarkdown(){
  return `# PRD — 건축 프롬프트 빌더

- 기준 버전: v1.4.11
- 작성일: 2026-10-21
- 소유자: 김형섭

---

## 1. 배경과 목적
건축 이미지를 AI(미드저니·챗GPT·제미나이)로 만들 때마다 프롬프트를 처음부터 영어로 새로 써야 한다. 한글 칩을 클릭하면 선택한 도구에 맞는 영어 프롬프트가 자동으로 완성되고 한글 번역도 함께 나온다.

## 2. 사용자
- 건축사·설계자
- 윈도우 PC 브라우저에서 HTML 파일을 직접 열어 사용(오프라인). 코딩 지식 없이 클릭과 복사·붙여넣기만 가능하면 됨.

## 3. 목표와 성공 기준
- 클릭만으로 결과가 나온다
- 복사해서 바로 쓸 수 있다
- 인터넷이 끊겨도 동작한다
- 같은 선택으로 미드저니·챗GPT·제미나이 3개 도구용 프롬프트를 탭만 바꿔 얻을 수 있다.

## 4. 기술 조건 (제약)
- HTML 파일 1개로 동작
- 인터넷·외부 API 없이 동작
- API 키·결제 기능 없음
- 기존 파일을 덮어쓰지 않고 새 버전 번호로 저장
- 이미지는 저장·전송하지 않음(화면 미리보기만)
- 화면은 한국어

## 5. 화면 구성
- 왼쪽 선택 / 오른쪽 결과
- 왼쪽: 칩 선택 영역 / 오른쪽: 도구 탭(미드저니·챗GPT·제미나이)과 완성된 프롬프트, 복사 버튼

## 6. 기능 명세
| 번호 | 기능 | 설명 |
|---|---|---|
| 1 | 칩 선택 | 건축 유형·재료·시점·조명 등을 클릭으로 선택하면 프롬프트가 자동 조립됨 |
| 2 | 화면 비율 선택 | 16:9, 9:16, 1:1 등 7종 비율을 고르면 도구별 형식으로 반영됨 |
| 3 | 사물→건물 변환 | 사물 사진을 올리면 그 형태·질감을 건물 디자인으로 재해석하는 문장을 생성 |
| 4 | 한글 번역 | 영어 프롬프트 옆에 같은 내용의 한글 번역을 함께 표시 |
| 5 | 복사 버튼 | 영어·한글 프롬프트를 각각 클립보드로 복사 |

## 7. 동작 규칙
- 조건을 선택하면 결과 문장이 바뀐다
- 값을 비우면 해당 항목이 결과에서 빠진다
- '극 사실 포토이미지'를 고르면 미드저니에 --style raw가 붙고, 챗GPT·제미나이 문장이 '실제 사진처럼'으로 바뀐다.

## 8. 저장과 초기 상태
- 입력 내용 자동 저장(localStorage)
- 업로드 이미지는 저장하지 않음
- 새로고침해도 유지됨
- 칩 선택·화면 스타일은 localStorage에 저장됨.

## 9. 범위 밖
- 이미지·영상 직접 생성
- 로그인·서버·여러 사용자
- 결제
- 데이터 서버 저장

## 10. 알려진 한계
AI 결과물의 사실감은 앱이 보장하지 못한다. 실제 결과는 AI 도구와 모델 버전에 따라 달라진다.

## 11. 완료 확인 체크리스트
- [ ] 파일을 인터넷 없이 더블클릭으로 열 수 있다
- [ ] 단일 칩을 다시 누르면 선택이 해제된다
- [ ] 탭을 바꾸면 영어·한글 프롬프트가 함께 바뀐다
- [ ] 복사 버튼이 각각 영어·한글을 복사한다
- [ ] 새로고침해도 칩 선택이 유지된다

## 12. 다음 버전 후보
- 기록 저장 기능 추가
- 칩 종류 더 추가
`;
}

function openExampleModal(){
  document.getElementById("exampleDoc").textContent = buildExampleMarkdown();
  document.getElementById("exampleModal").classList.add("show");
}
function closeExampleModal(){
  document.getElementById("exampleModal").classList.remove("show");
}

function escapeHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeAttr(s){
  return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}
